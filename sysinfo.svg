<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="310" viewBox="0 0 460 310">
  <style>
    .panel { font-family: "JetBrains Mono", Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .title { fill: #8892B0; font-weight: bold; }
    .key { fill: #00FFD1; font-weight: bold; }
    .val { fill: #E4F0FB; }
    .chrome { fill: #1E1E2E; }
    .dot { rx: 5; ry: 5; width: 10px; height: 10px; }
    .row { opacity: 0; animation: fade-in 0.5s ease forwards; }
    @keyframes fade-in { to { opacity: 1; } }
  </style>
  <rect width="460" height="310" fill="#0D0D0D" rx="8" stroke="#1E1E2E" stroke-width="1.5" />
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 452,0 A 8,8 0 0,1 460,8 L 460,40 L 0,40 Z" fill="#16161E" />
  <circle cx="20" cy="20" r="6" fill="#FF5F56" />
  <circle cx="40" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="20" r="6" fill="#27C93F" />
  <text x="230.0" y="25" class="panel title" text-anchor="middle">NnAsankaMadushan ~ whoami</text>
  <g class="row" style="animation-delay: 0ms;">
    <text x="20" y="60" class="panel key">&gt; name:</text>
    <text x="130" y="60" class="panel val">Asanka Madushan</text>
  </g>
  <g class="row" style="animation-delay: 200ms;">
    <text x="20" y="90" class="panel key">&gt; user:</text>
    <text x="130" y="90" class="panel val">nnamadushan@gmail.com</text>
  </g>
  <g class="row" style="animation-delay: 400ms;">
    <text x="20" y="120" class="panel key">&gt; role:</text>
    <text x="130" y="120" class="panel val">Full Stack / Mobile Developer</text>
  </g>
  <g class="row" style="animation-delay: 600ms;">
    <text x="20" y="150" class="panel key">&gt; focus:</text>
    <text x="130" y="150" class="panel val">Frontend, Mobile &amp; Systems</text>
  </g>
  <g class="row" style="animation-delay: 800ms;">
    <text x="20" y="180" class="panel key">&gt; stack:</text>
    <text x="130" y="180" class="panel val">React | Flutter | Node | PHP</text>
  </g>
  <g class="row" style="animation-delay: 1000ms;">
    <text x="20" y="210" class="panel key">&gt; now:</text>
    <text x="130" y="210" class="panel val">Building clean-architecture apps</text>
  </g>
  <g class="row" style="animation-delay: 1200ms;">
    <text x="20" y="240" class="panel key">&gt; school:</text>
